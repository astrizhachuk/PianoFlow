<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonal Analysis</title>
</head>
<body>
<script src="./tonal.min.js"></script>

<script>
    // Store the last result so we can access it
    window.lastAnalysisResult = null;

    function simplifyNote(note) {
        console.log("JS: Received note for simplification: " + note);
        if (typeof Tonal === 'undefined' || !note) {
            console.error("JS: Tonal.js not loaded or no note provided.");
            window.lastAnalysisResult = null;
            return null;
        }
        try {
            const result = Tonal.Note.simplify(note);
            console.log("JS: Single note simplified to: " + result);
            window.lastAnalysisResult = result;
            return result;
        } catch(e) {
            console.error("JS: Note simplification failed: ", e);
            window.lastAnalysisResult = null;
            return null;
        }
    }

    function detectChord(notes) {
        console.log("JS: Received notes for chord detection: " + JSON.stringify(notes));
        if (typeof Tonal === 'undefined' || !notes || notes.length === 0) {
            console.error("JS: Tonal.js not loaded or no notes provided.");
            window.lastAnalysisResult = null;
            return null;
        }
        try {
            const detectedChords = Tonal.Chord.detect(notes);
            let result = null;
            if (detectedChords.length > 0) {
                result = detectedChords[0];
                console.log("JS: Detected chord: " + result);
            } else {
                console.log("JS: No chord detected for notes: " + JSON.stringify(notes));
            }
            window.lastAnalysisResult = result;
            return result;
        } catch(e) {
            console.error("JS: Chord detection failed: ", e);
            window.lastAnalysisResult = null;
            return null;
        }
    }
</script>
</body>
</html>
