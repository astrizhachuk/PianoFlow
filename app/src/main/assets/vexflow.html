
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #staff { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="staff"></div>

<script src="./vexflow.js"></script>

<script>
    /**
     * Отрисовывает полный нотный стан, разделяя обычные и "призрачные" ноты.
     */
    function drawGrandStaff(trebleNotesData, bassNotesData) {
        const div = document.getElementById("staff");
        if (!div || (div.clientWidth === 0 || div.clientHeight === 0)) {
            requestAnimationFrame(() => drawGrandStaff(trebleNotesData, bassNotesData));
            return;
        }

        div.innerHTML = '';
        if (typeof Vex === 'undefined' || typeof Vex.Flow === 'undefined') return;

        try {
            const renderer = new Vex.Flow.Renderer(div, Vex.Flow.Renderer.Backends.SVG);
            renderer.resize(div.clientWidth, div.clientHeight);
            const context = renderer.getContext();

            const staveWidth = div.clientWidth - 20;
            // Максимально увеличиваем расстояние между станами
            const trebleStave = new Vex.Flow.Stave(10, 80, staveWidth).addClef("treble").addTimeSignature("4/4");
            const bassStave = new Vex.Flow.Stave(10, 220, staveWidth).addClef("bass").addTimeSignature("4/4");

            trebleStave.setContext(context).draw();
            bassStave.setContext(context).draw();

            new Vex.Flow.StaveConnector(trebleStave, bassStave).setType(Vex.Flow.StaveConnector.type.BRACE).setContext(context).draw();
            new Vex.Flow.StaveConnector(trebleStave, bassStave).setType(Vex.Flow.StaveConnector.type.SINGLE_LEFT).setContext(context).draw();

            // Создаем и отрисовываем голоса для каждого стана
            drawVoices(context, trebleStave, trebleNotesData);
            drawVoices(context, bassStave, bassNotesData);

        } catch (e) {
            console.error("VexFlow rendering error: ", e);
        }
    }

    /**
     * Создает и отрисовывает голоса (обычный и "призрачный") для одного нотного стана.
     */
    function drawVoices(context, stave, notesData) {
        if (!notesData || notesData.length === 0) return;

        const normalNotes = notesData.filter(d => !d.ghost);
        const ghostNotes = notesData.filter(d => d.ghost);

        const voices = [];
        if (normalNotes.length > 0) {
            voices.push(createVoice(normalNotes, stave.getClef(), false));
        }
        if (ghostNotes.length > 0) {
            voices.push(createVoice(ghostNotes, stave.getClef(), true));
        }

        if (voices.length > 0) {
            new Vex.Flow.Formatter().joinVoices(voices).format(voices, stave.getWidth() - 50);
            voices.forEach(v => v.draw(context, stave));
        }
    }

    /**
     * Создает один голос из массива нот.
     */
    function createVoice(notesData, clef, isGhost) {
        const notes = notesData.map(noteData => {
            noteData.clef = clef;
            const staveNote = new Vex.Flow.StaveNote(noteData);
            if (isGhost) {
                // Устанавливаем серый цвет для "призрачных" нот
                staveNote.setStyle({ fillStyle: "grey", strokeStyle: "grey" });
            }
            return staveNote;
        });

        const voice = new Vex.Flow.Voice({ num_beats: 4, beat_value: 4 });
        voice.setStrict(false);
        voice.addTickables(notes);
        Vex.Flow.Accidental.applyAccidentals([voice]);
        return voice;
    }

    document.addEventListener('DOMContentLoaded', () => {
         drawGrandStaff([], []);
    });
</script>
</body>
</html>
