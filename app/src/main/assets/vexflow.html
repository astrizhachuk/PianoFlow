<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        }
        #staff {
            width: 100%;
            height: 100%;
            display: inline-block;
        }
    </style>
</head>
<body>
<div id="staff"></div>

<script src="./vexflow.js"></script>

<script>
    function drawGrandStaff(trebleNotesData, bassNotesData, isPortrait, isDarkScheme, needsScale) {
        const div = document.getElementById("staff");
        if (!div) return;
        div.innerHTML = '';

        const width = div.clientWidth;
        const height = div.clientHeight;

        if (width <= 0 || height <= 0) {
            console.log("JS: Container has no size yet.");
            return;
        }

        if (typeof Vex === 'undefined' || typeof Vex.Flow === 'undefined') return;

        const color = isDarkScheme ? 'white' : 'black';
        const ghostColor = isDarkScheme ? '#666666' : '#aaaaaa';

        try {
            const renderer = new Vex.Flow.Renderer(div, Vex.Flow.Renderer.Backends.SVG);
            renderer.resize(width, height);
            const context = renderer.getContext();
            context.setFillStyle(color);
            context.setStrokeStyle(color);

            let scale;
            let maxStaveWidth;
            let gap;

            if (isPortrait) {
                if (needsScale) {
                    scale = 0.8;
                    maxStaveWidth = 180;
                    gap = 180;
                } else {
                    scale = 1.5;
                    maxStaveWidth = 250;
                    gap = 220;
                }
            } else {
                if (needsScale) {
                    scale = 0.7;
                    maxStaveWidth = 180;
                    gap = 180;
                } else {
                    scale = 1.1;
                    maxStaveWidth = 250;
                    gap = 220;
                }
            }

            context.scale(scale, scale);

            const scaledWidth = width / scale;
            const scaledHeight = height / scale;

            const horizontalPadding = 40;
            const staveHeight = 100;
            const minTopMargin = 20;

            const staveWidth = Math.min(maxStaveWidth, scaledWidth - horizontalPadding);
            const x = (scaledWidth - staveWidth) / 2;

            const totalStaffHeight = gap + staveHeight;
            const yBase = (scaledHeight - totalStaffHeight) / 2;

            const trebleY = Math.max(minTopMargin, yBase);
            const bassY = trebleY + gap;

            const trebleStave = new Vex.Flow.Stave(x, trebleY, staveWidth).addClef("treble").addTimeSignature("C");
            const bassStave = new Vex.Flow.Stave(x, bassY, staveWidth).addClef("bass").addTimeSignature("C");

            trebleStave.setContext(context).draw();
            bassStave.setContext(context).draw();

            new Vex.Flow.StaveConnector(trebleStave, bassStave).setType(Vex.Flow.StaveConnector.type.BRACE).setContext(context).draw();
            new Vex.Flow.StaveConnector(trebleStave, bassStave).setType(Vex.Flow.StaveConnector.type.SINGLE_LEFT).setContext(context).draw();

            drawVoices(context, trebleStave, trebleNotesData, ghostColor);
            drawVoices(context, bassStave, bassNotesData, ghostColor);

        } catch (e) {
            console.error("VexFlow rendering error: ", e);
        }
    }

    function drawVoices(context, stave, notesData, ghostColor) {
        if (!notesData || notesData.length === 0) return;
        const normalNotes = notesData.filter(d => !d.ghost);
        const ghostNotes = notesData.filter(d => d.ghost);
        const voices = [];
        if (normalNotes.length > 0) voices.push(createVoice(normalNotes, stave.getClef(), false, ghostColor));
        if (ghostNotes.length > 0) voices.push(createVoice(ghostNotes, stave.getClef(), true, ghostColor));
        if (voices.length > 0) {
            const formatter = new Vex.Flow.Formatter().joinVoices(voices);
            const justifyWidth = stave.getNoteEndX() - stave.getNoteStartX();
            formatter.format(voices, justifyWidth);
            voices.forEach(v => v.draw(context, stave));
        }
    }

    function createVoice(notesData, clef, isGhost, ghostColor) {
        const notes = notesData.map(noteData => {
            noteData.clef = clef;
            const staveNote = new Vex.Flow.StaveNote(noteData);
            if (isGhost) staveNote.setStyle({ fillStyle: ghostColor, strokeStyle: ghostColor });
            return staveNote;
        });
        const voice = new Vex.Flow.Voice({ num_beats: 4, beat_value: 4 });
        voice.setStrict(false);
        voice.addTickables(notes);
        Vex.Flow.Accidental.applyAccidentals([voice]);
        return voice;
    }

</script>
</body>
</html>
