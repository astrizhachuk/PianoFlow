name: Bug report
description: Report something broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / Android version
      placeholder: "e.g. Pixel 7, Android 14"

  - type: input
    id: app-version
    attributes:
      label: App version or commit SHA

  - type: input
    id: midi-device
    attributes:
      label: MIDI device (if relevant)
      placeholder: "e.g. Yamaha P-125 over USB"

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Timber output (Logcat), screenshots, or recordings.
